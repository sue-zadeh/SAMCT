server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 40m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self'; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location ~ ^/(api|uploads)(/|$) {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        # Preserve the API's stricter sandbox policy on document downloads.
    }
    location ~ ^/(admin|resident|village-manager|account|login|register|forgot-password|reset-password)(/|$) {
        # portal.html is always noindex; authenticated data still comes only from the API.
        try_files /portal.html =404;
    }
    location /assets/ { try_files $uri =404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /about { try_files /about/index.html =404; }
    location = /marketing { try_files /marketing/index.html =404; }
    location = /contactUs { try_files /contactUs/index.html =404; }
    location = /contactus { return 308 /contactUs; }
    location = /contactus/ { return 308 /contactUs; }
    location = /contactUs/ { return 308 /contactUs; }
    location = /about/ { return 308 /about; }
    location = /marketing/ { return 308 /marketing; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/index.html =404; }
}
