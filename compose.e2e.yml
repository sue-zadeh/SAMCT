name: samct-e2e
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: samct_e2e
      POSTGRES_USER: samct_e2e
      POSTGRES_PASSWORD: ${SAMCT_E2E_DATABASE_PASSWORD:?Set a disposable test database password}
    ports:
      - "127.0.0.1:${SAMCT_E2E_DATABASE_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samct_e2e -d samct_e2e"]
      interval: 3s
      timeout: 3s
      retries: 20
  scanner:
    image: clamav/clamav:stable
    ports:
      - "127.0.0.1:${SAMCT_E2E_SCANNER_PORT:-3311}:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
