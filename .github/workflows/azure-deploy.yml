name: Deploy SAMCT to Azure App Service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "server/**"
      - "scripts/**"
      - "index.html"
      - "package*.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/azure-deploy.yml"

permissions:
  contents: read

concurrency:
  group: samct-azure-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install client dependencies
        run: npm ci
      - name: Validate source
        run: npm run check:source
      - name: Build React and prerender public pages
        env:
          VITE_API_BASE_URL: ""
          VITE_ALLOW_INDEXING: "false"
          VITE_SITE_URL: https://samct-villages-bjgxenc0avdue9hn.newzealandnorth-01.azurewebsites.net
        run: npm run build
      - name: Build ASP.NET Core
        run: dotnet publish server/server.csproj --configuration Release --output ./publish --warnaserror
      - name: Bundle React with ASP.NET Core for same-origin hosting
        run: |
          mkdir -p publish/wwwroot
          cp -a dist/. publish/wwwroot/
          test -f publish/wwwroot/index.html
          test -f publish/wwwroot/portal.html
          test -f publish/wwwroot/about/index.html
          test -f publish/server.dll
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: samct-villages
          publish-profile: ${{ secrets.NEWSAMCT }}
          package: ./publish
      - name: Check deployed API health
        run: |
          # GitHub Actions no longer needs Azure CLI credentials with a publish profile.
          HOST="samct-villages-bjgxenc0avdue9hn.newzealandnorth-01.azurewebsites.net"
          for i in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 "https://$HOST/api/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "Deployment health check failed. Inspect Azure App Service logs."
          exit 1
