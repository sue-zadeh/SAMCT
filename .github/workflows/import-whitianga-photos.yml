name: Import approved Whitianga property photos

on:
  push:
    branches: [whitianga-local-photos-20261104]
    paths:
      - ".github/workflows/import-whitianga-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Save the original Richardsons listing images
        run: node scripts/import-whitianga-images.mjs
      - name: Build with local Whitianga photos
        run: |
          npm ci
          npm run build
      - name: Commit downloaded photos to the project assets folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/assets/Whitianga/
          git diff --cached --quiet && exit 0
          git commit -m "Save Whitianga listing photos in client assets"
          git push origin "HEAD:${GITHUB_REF_NAME}"
